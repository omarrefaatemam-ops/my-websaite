<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>OMAR TOOLS</title>

  <meta
    name="description"
    content="OMAR TOOLS - مجموعة أدوات مجانية ومفيدة في مكان واحد"
  >

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- الهيدر -->
  <header class="header">

    <div class="logo-area">
      <div class="logo">O</div>

      <div>
        <h1>OMAR TOOLS</h1>
        <p>كل أدواتك في مكان واحد</p>
      </div>
    </div>

    <button id="themeBtn" class="theme-btn">
      ☀️
    </button>

  </header>


  <!-- الصفحة الرئيسية -->
  <main id="home">

    <section class="hero">

      <div class="hero-content">

        <span class="badge">
          OMAR TOOLS
        </span>

        <h2>
          كل الأدوات اللي محتاجها
          <span>في مكان واحد</span>
        </h2>

        <p>
          أدوات للصور والفيديو وPDF والنصوص وQR
          والمطورين والحسابات وأكثر.
        </p>

      </div>

      <div class="hero-logo">
        OT
      </div>

    </section>


    <!-- البحث -->
    <section class="search-area">

      <input
        id="searchInput"
        type="search"
        placeholder="🔎 ابحث عن أداة..."
      >

    </section>


    <!-- التصنيفات -->
    <section
      id="categories"
      class="categories">
    </section>


    <!-- الأدوات -->
    <section
      id="toolsGrid"
      class="tools-grid">
    </section>

  </main>


  <!-- شاشة الأداة -->
  <section
    id="toolPage"
    class="tool-page hidden">

    <button
      id="backButton"
      class="back-button">

      ← رجوع للأدوات

    </button>

    <div class="tool-header">

      <span id="toolCategory"></span>

      <h2 id="toolTitle"></h2>

      <p id="toolDescription"></p>

    </div>

    <div
      id="toolContent"
      class="tool-content">
    </div>

  </section>


  <!-- الفوتر -->
  <footer>

    <strong>OMAR TOOLS</strong>

    <p>
      أدوات مفيدة وسريعة في مكان واحد
    </p>

    <small>
      © 2026 OMAR TOOLS
    </small>

  </footer>


  <script src="app.js"></script>

</body>
</html>
