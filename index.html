<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عمر شريف رفعت | Omar Sherif</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            line-height: 1.6;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            width: 100%;
            max-width: 450px;
            background: linear-gradient(135deg, #1e293b, #334155);
            padding: 40px 25px;
            border-radius: 24px;
            border: 1px solid #475569;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #00f2fe, #fe2c55, #38bdf8);
        }
        .profile-img {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #38bdf8;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
            margin-bottom: 20px;
        }
        h1 {
            font-size: 1.8rem;
            font-weight: 900;
            color: #ffffff;
            margin-bottom: 5px;
        }
        .subtitle {
            color: #38bdf8;
            font-size: 0.95rem;
            font-weight: 700;
            margin-bottom: 25px;
        }
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .btn-link {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px 20px;
            border-radius: 12px;
            color: white;
            text-decoration: none;
            font-weight: bold;
            font-size: 1rem;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-link:hover {
            transform: translateY(-2px);
        }
        .tiktok {
            background: linear-gradient(45deg, #00f2fe, #fe2c55);
            box-shadow: 0 4px 15px rgba(254, 44, 85, 0.3);
        }
        .phone {
            background: linear-gradient(45deg, #16a34a, #22c55e);
            box-shadow: 0 4px 15px rgba(34, 197, 94, 0.3);
        }
    </style>
</head>
<body>
    <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>متجر قطع وإكسسوارات الكمبيوتر - مصر</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #0b0f19;
      --bg-card: #151c2c;
      --border-color: #232d42;
      --accent-color: #2563eb;
      --amazon-color: #ff9900;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --green-price: #22c55e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background-color: var(--bg-primary); color: var(--text-main); padding-bottom: 60px; }

    /* Header */
    header {
      background-color: #111827;
      border-bottom: 1px solid var(--border-color);
      padding: 20px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    header h1 { font-size: 1.5rem; color: #fff; margin-bottom: 15px; }
    
    /* Search Bar */
    .search-container {
      max-width: 600px;
      margin: 0 auto;
      position: relative;
    }
    .search-container input {
      width: 100%;
      padding: 12px 45px 12px 15px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background-color: var(--bg-primary);
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }
    .search-container i {
      position: absolute;
      right: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
    }

    .container { max-width: 1200px; margin: 20px auto; padding: 0 15px; }

    /* Categories Tabs */
    .category-tabs {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 10px;
      margin-bottom: 25px;
      scrollbar-width: thin;
    }
    .tab-btn {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 10px 18px;
      border-radius: 20px;
      cursor: pointer;
      white-space: nowrap;
      font-weight: 600;
      font-size: 0.88rem;
      transition: all 0.2s;
    }
    .tab-btn.active, .tab-btn:hover {
      background-color: var(--accent-color);
      color: #fff;
      border-color: var(--accent-color);
    }

    /* Products Grid */
    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 18px;
    }

    /* Product Card */
    .product-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s, border-color 0.2s;
    }
    .product-card:hover {
      transform: translateY(-4px);
      border-color: var(--accent-color);
    }

    .card-badge {
      font-size: 0.75rem;
      background: rgba(37, 99, 235, 0.2);
      color: #60a5fa;
      padding: 4px 8px;
      border-radius: 4px;
      width: fit-content;
      margin-bottom: 10px;
      font-weight: bold;
    }

    .product-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-main);
      line-height: 1.4;
      margin-bottom: 15px;
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: auto;
      padding-top: 12px;
      border-top: 1px solid rgba(255,255,255,0.05);
    }

    .price {
      font-size: 1.15rem;
      font-weight: bold;
      color: var(--green-price);
    }

    .amazon-btn {
      background-color: var(--amazon-color);
      color: #000;
      text-decoration: none;
      padding: 8px 12px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: opacity 0.2s;
    }
    .amazon-btn:hover { opacity: 0.9; }
  </style>
</head>
<body>

  <header>
    <h1>عروض وقطع الكمبيوتر والإكسسوارات (أمازون مصر)</h1>
    <div class="search-container">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="text" id="searchInput" placeholder="ابحث عن فلاشة، ماوس، كارت شاشة، كابل..." onkeyup="filterProducts()">
    </div>
  </header>

  <div class="container">
    <!-- الأقسام -->
    <div class="category-tabs">
      <button class="tab-btn active" onclick="filterCategory('all', this)">الكل</button>
      <button class="tab-btn" onclick="filterCategory('cheap', this)">منتجات خفيفة (أقل من 300 ج.م)</button>
      <button class="tab-btn" onclick="filterCategory('flash', this)">فلاشات وكروت ذاكرة</button>
      <button class="tab-btn" onclick="filterCategory('accessories', this)">ماوسات وكيبوردات</button>
      <button class="tab-btn" onclick="filterCategory('cables', this)">كابلات وصلات</button>
      <button class="tab-btn" onclick="filterCategory('storage', this)">هاردات & SSD</button>
      <button class="tab-btn" onclick="filterCategory('pc_parts', this)">قطع كمبيوتر أصلية</button>
    </div>

    <!-- شبكة المنتجات -->
    <div class="products-grid" id="productsGrid">
      <!-- يتم التحميل هنا عبر JavaScript -->
    </div>
  </div>

  <script>
    const TRACKING_ID = "pcbuilder2026-20";

    // قائمة منتجات متنوعة بأسعار مصرية وبأقسام خفيفة واقتصادية
    const products = [
      // منتجات خفيفة واقتصادية وفلاشات
      { id: 1, category: "flash", isCheap: true, catName: "فلاشة", name: "SanDisk Cruzer Blade 32GB USB 2.0", asin: "B002U1Z162", price: 185 },
      { id: 2, category: "flash", isCheap: true, catName: "فلاشة", name: "Kingston DataTraveler Exodia 64GB USB 3.2", asin: "B08JD36Y64", price: 240 },
      { id: 3, category: "flash", isCheap: false, catName: "فلاشة", name: "SanDisk Ultra 128GB USB 3.0 Flash Drive", asin: "B00P8XQ686", price: 420 },
      { id: 4, category: "flash", isCheap: true, catName: "كارت ميموري", name: "SanDisk Ultra 32GB MicroSDHC Memory Card", asin: "B073JWXGNT", price: 195 },

      // ماوسات وكيبوردات واكسسوارات خفيفة
      { id: 5, category: "accessories", isCheap: true, catName: "ماوس", name: "ماوس سلكي يو اس بي USB اقتصادي للكمبيوتر", asin: "B005EJH6RW", price: 120 },
      { id: 6, category: "accessories", isCheap: true, catName: "ماوس وايرلس", name: "ماوس لاسلكي 2.4GHz مريح لليد", asin: "B07235994B", price: 230 },
      { id: 7, category: "accessories", isCheap: false, catName: "كيبورد وماوس", name: "طقم كيبورد وماوس سلكي مكتب من ديل / إتش بي", asin: "B013C9S21Q", price: 450 },
      { id: 8, category: "accessories", isCheap: true, catName: "ماوس باد", name: "ماوس باد قياسية ضد الانزلاق للألعاب والمكتب", asin: "B000UEZ1SM", price: 90 },

      // كابلات ووصلات اقتصادية
      { id: 9, category: "cables", isCheap: true, catName: "كابل HDMI", name: "كابل HDMI إلى HDMI 1.5 متر لدقة 1080p", asin: "B014I8SSD0", price: 85 },
      { id: 10, category: "cables", isCheap: true, catName: "تحويلة", name: "تحويلة OTG Type-C إلى USB 3.0 للموبايل والكمبيوتر", asin: "B015Z7XE0A", price: 65 },
      { id: 11, category: "cables", isCheap: true, catName: "كابل نت", name: "كابل شبكة Cat6 إيثرنت طول 3 متر", asin: "B00N2VIALK", price: 110 },

      // هاردات ووسائط تخزين
      { id: 12, category: "storage", isCheap: false, catName: "SSD داخلي", name: "Kingston A400 240GB SATA 3 SSD", asin: "B01N5IB20Q", price: 890 },
      { id: 13, category: "storage", isCheap: false, catName: "SSD M.2", name: "Kingston NV2 500GB M.2 NVMe SSD", asin: "B0BBWJH1X8", price: 1650 },
      { id: 14, category: "storage", isCheap: false, catName: "هارد خارجي", name: "WD Elements 1TB External Hard Drive", asin: "B06VVTVT39", price: 2850 },

      // قطع كمبيوتر تجميعات
      { id: 15, category: "pc_parts", isCheap: false, catName: "رامات", name: "Crucial 8GB DDR4 3200MHz Desktop RAM", asin: "B08C4Z69LN", price: 850 },
      { id: 16, category: "pc_parts", isCheap: false, catName: "معالج", name: "Intel Core i3-12100F Processor", asin: "B09NPJX7PV", price: 4200 },
      { id: 17, category: "pc_parts", isCheap: false, catName: "كارت شاشة", name: "MSI GeForce GTX 1650 4GB GDDR6", asin: "B086VR41X2", price: 7900 }
    ];

    let currentCategory = 'all';

    function renderProducts(items) {
      const grid = document.getElementById('productsGrid');
      grid.innerHTML = '';

      if(items.length === 0) {
        grid.innerHTML = '<p style="color: var(--text-muted); text-align: center; grid-column: 1/-1; padding: 40px;">لا توجد منتجات مطابقة للبحث.</p>';
        return;
      }

      items.forEach(item => {
        // رابط أمازون مصر المباشر مدمج به التتبع
        const affiliateLink = `https://www.amazon.eg/dp/${item.asin}?tag=${TRACKING_ID}`;
        const cardHTML = `
          <div class="product-card">
            <div>
              <span class="card-badge">${item.catName}</span>
              <h3 class="product-title">${item.name}</h3>
            </div>
            <div class="card-footer">
              <span class="price">${item.price.toLocaleString('ar-EG')} ج.م</span>
              <a href="${affiliateLink}" target="_blank" rel="noopener" class="amazon-btn">
                <i class="fa-brands fa-amazon"></i> شراء
              </a>
            </div>
          </div>
        `;
        grid.innerHTML += cardHTML;
      });
    }

    function filterCategory(cat, btn) {
      currentCategory = cat;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filterProducts();
    }

    function filterProducts() {
      const searchTerm = document.getElementById('searchInput').value.toLowerCase();
      
      const filtered = products.filter(item => {
        let matchesCategory = false;
        if (currentCategory === 'all') matchesCategory = true;
        else if (currentCategory === 'cheap') matchesCategory = item.isCheap || item.price <= 300;
        else matchesCategory = (item.category === currentCategory);

        const matchesSearch = item.name.toLowerCase().includes(searchTerm) || item.catName.toLowerCase().includes(searchTerm);
        return matchesCategory && matchesSearch;
      });

      renderProducts(filtered);
    }

    renderProducts(products);
  </script>
</body>
</html>
