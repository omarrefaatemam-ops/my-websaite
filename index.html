<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقعي الشخصي</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .card {
            background: #fff;
            max-width: 500px;
            margin: 50px auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h1 { color: #2c3e50; }
        p { line-height: 1.6; }
        .btn {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 20px;
            background-color: #3498db;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>أهلاً انا عمر شريف باخد برمجه مع مستر أحمد مدحت بك في موقعي الشخصي</h1>
        <p>مرحباً بك! هذا موقعي الشخصي الأول المرفوع على الإنترنت.</p>
        <a href="#" class="btn">تواصل معي</a>
    </div>

</body>
</html>
