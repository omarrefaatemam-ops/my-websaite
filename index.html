            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .btn-link {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px 20px;
            border-radius: 12px;
            color: white;
            text-decoration: none;
            font-weight: bold;
            font-size: 1rem;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-link:hover {

        }
        .tiktok {

        .phone {

            box-shadow: 0 4px 15px rgba(34, 197, 94, 0.3);

    <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تجميعة الكمبيوتر - PC Builder</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
    .container { max-width: 1000px; margin: auto; }
    h1 { text-align: center; color: #38bdf8; margin-bottom: 30px; }
    
    .builder-grid { display: grid; grid-template-columns: 1fr; gap: 15px; }
    
    .part-card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .part-info { flex: 2; min-width: 250px; }
    .part-category { font-size: 0.85rem; color: #94a3b8; font-weight: bold; }
    .part-title { font-size: 1.1rem; color: #e2e8f0; margin: 5px 0; }
    
    .part-price { font-size: 1.2rem; font-weight: bold; color: #4ade80; flex: 1; text-align: left; }

    .buy-btn {
      background-color: #ff9900;
      color: #111;
      text-decoration: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: bold;
      transition: 0.2s;
    }
    .buy-btn:hover { background-color: #ffac33; }

    .summary-card {
      background: linear-gradient(135deg, #0284c7, #2563eb);
      border-radius: 12px;
      padding: 20px;
      margin-top: 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
    }
    .total-price { font-size: 1.5rem; font-weight: bold; }
  </style>
</head>
<body>

  <div class="container">
    <h1>مُجمع قطع الكمبيوتر (PC Builder)</h1>
    
    <div id="builder" class="builder-grid">
      <!-- يتم تحميل القطع هنا تلقائياً بـ JavaScript -->
    </div>

    <div class="summary-card">
      <div>
        <h3>إجمالي التجميعة المقترحة:</h3>
        <span id="total-amount" class="total-price">$0.00</span>
      </div>
      <p style="margin: 0; font-size: 0.9rem; opacity: 0.9;">الأسعار محدثة ومربوطة مباشرة بـ Amazon</p>
    </div>
  </div>

  <script>
    const TRACKING_ID = "pcbuilder2026-20";

    // بيانات التجميعة كاملة
    const pcParts = [
      { category: "المعالج (CPU)", name: "Intel Core i5-13400F", asin: "B0BN83N3B7", price: 199.99 },
      { category: "كارت الشاشة (GPU)", name: "NVIDIA GeForce RTX 4060 8GB", asin: "B0C8JY4NKR", price: 299.99 },
      { category: "اللوحة الأم (Motherboard)", name: "MSI PRO B760M-P DDR4", asin: "B0BRQR9X13", price: 99.99 },
      { category: "الرامات (RAM)", name: "Corsair Vengeance LPX 16GB (2x8GB) DDR4", asin: "B0143UM4TC", price: 39.99 },
      { category: "وحدة التخزين (Storage)", name: "Kingston NV2 1TB M.2 NVMe SSD", asin: "B0BBWH1R8H", price: 60.99 },
      { category: "مزود الطاقة (PSU)", name: "MSI MAG A650BN 650W 80 Plus Bronze", asin: "B0991TZ39G", price: 59.99 }
    ];

    function renderPCBuilder() {
      const builderContainer = document.getElementById('builder');
      let totalPrice = 0;

      builderContainer.innerHTML = '';

      pcParts.forEach(part => {
        totalPrice += part.price;
        const affiliateLink = `https://www.amazon.com/dp/${part.asin}?tag=${TRACKING_ID}`;

        const cardHTML = `
          <div class="part-card">
            <div class="part-info">
              <span class="part-category">${part.category}</span>
              <div class="part-title">${part.name}</div>
            </div>
            <div class="part-price">$${part.price.toFixed(2)}</div>
            <a href="${affiliateLink}" target="_blank" class="buy-btn">شراء من أمازون</a>
          </div>
        `;
        builderContainer.innerHTML += cardHTML;
      });

      document.getElementById('total-amount').innerText = `$${totalPrice.toFixed(2)}`;
    }

    // تشغيل الدالة فور تحميل الصفحة
    renderPCBuilder();
  </script>
</body>
</html>
