<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عمر شريف رفعت | Omar Sherif</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            line-height: 1.6;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            width: 100%;
            max-width: 450px;
            background: linear-gradient(135deg, #1e293b, #334155);
            padding: 40px 25px;
            border-radius: 24px;
            border: 1px solid #475569;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #00f2fe, #fe2c55, #38bdf8);
        }
        .profile-img {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #38bdf8;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
            margin-bottom: 20px;
        }
        h1 {
            font-size: 1.8rem;
            font-weight: 900;
            color: #ffffff;
            margin-bottom: 5px;
        }
        .subtitle {
            color: #38bdf8;
            font-size: 0.95rem;
            font-weight: 700;
            margin-bottom: 25px;
        }
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .btn-link {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px 20px;
            border-radius: 12px;
            color: white;
            text-decoration: none;
            font-weight: bold;
            font-size: 1rem;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-link:hover {
            transform: translateY(-2px);
        }
        .tiktok {
            background: linear-gradient(45deg, #00f2fe, #fe2c55);
            box-shadow: 0 4px 15px rgba(254, 44, 85, 0.3);
        }
        .phone {
            background: linear-gradient(45deg, #16a34a, #22c55e);
            box-shadow: 0 4px 15px rgba(34, 197, 94, 0.3);
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- صورة البروفايل -->
        <img src="https://via.placeholder.com/150" alt="عمر شريف" class="profile-img">
        
        <!-- الاسم والصفة -->
        <h1>عمر شريف رفعت</h1>
        <p class="subtitle">الموقع الشخصي للتواصل والبروفايل</p>

        <!-- أزرار التواصل -->
        <div class="links-container">
            <a href="https://www.tiktok.com/@omar.sherif625?_r=1&_t=ZS-99tJIvnmR0v" target="_blank" class="btn-link tiktok">
                🎵 حسابي على تيك توك
            </a>

            <a href="tel:01278384609" class="btn-link phone">
                📞 اتصل بي: 01278384609
            </a>
        </div>
    </div>

</body>
</html>
